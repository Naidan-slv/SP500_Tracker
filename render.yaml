services:
  - type: web
    name: sp500-tracker-api
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false          # set manually in Render dashboard
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: APP_BASE_URL
        sync: false          # set to your Render service URL after deploy
      - key: FRONTEND_URL
        sync: false          # set to your frontend Render static site URL after deploy
      - key: FINNHUB_API_KEY
        sync: false          # set manually in Render dashboard

  - type: web
    name: sp500-tracker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sp500-tracker.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
